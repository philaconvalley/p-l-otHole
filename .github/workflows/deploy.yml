name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "packages/db/migrations/**"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Sync www/ and run migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          echo "${{ secrets.SSH_HOST }} $(ssh-keyscan -t rsa ${{ secrets.SSH_HOST }} 2>/dev/null | awk '{print $2, $3}')" > ~/.ssh/known_hosts

      - name: Rsync www/ to server
        run: |
          rsync -rlv --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            www/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/vabch.org/plot/

      - name: Rsync migrations to server
        run: |
          rsync -rlv --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            packages/db/migrations/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/plothole/migrations/

      - name: Run migrations
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash /opt/plothole/migrate.sh"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
